[package]
name = "lumiknit-cli-edc"
version = "0.5.1"
edition = "2024"
description = "My CLI junk/toy tools"
readme = "README.md"
repository = "https://github.com/lumiknit/lumiknit-cli-edc"
license = "MIT"
categories = ["command-line-utilities"]

[dependencies]
arboard = { version = "3", default-features = false }
tempfile = "3"
serde_json = "1"
regex = "1"
serde_yml = "0.0"
toml = "1.1"
libc = "0.2.186"
which = "8.0.2"
html5ever = "0.40"
markup5ever_rcdom = "0.40"

[[bin]]
name = "html-skim"
path = "src/html-skim/main.rs"

[[bin]]
name = "llm"
path = "src/llm/main.rs"

[[bin]]
name = "md"
path = "src/md/main.rs"

[[bin]]
name = "ww"
path = "src/ww/main.rs"

[[bin]]
name = "jex"
path = "src/jex/main.rs"

[[bin]]
name = "jflat"
path = "src/jflat/main.rs"

[[bin]]
name = "wtr"
path = "src/wtr/main.rs"

[[bin]]
name = "lsel"
path = "src/lsel/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
